spring.application.name=AlumuniConnect
server.port=8080

# Supabase PostgreSQL Pooler Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:${host:aws-0-eu-west-1.pooler.supabase.com}}:${DB_PORT:${port:5432}}/${DB_NAME:${database:postgres}}?sslmode=require
spring.datasource.username=${DB_USER:${user:postgres.kckxylppieayileqnzfh}}
spring.datasource.password=${DB_PASSWORD:${password:vishu@3112006}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool settings for Supabase Pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON serialization settings
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
